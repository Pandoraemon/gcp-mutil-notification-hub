# 推荐默认告警：GCP 配额耗尽与超限预警（Quota Exceeded / 80% 配额预警）。
#
# serviceruntime.googleapis.com/quota/exceeded 是 GAUGE / BOOL 指标
# （cloud.google.com/monitoring/api/metrics_gcp_p_z#gcp-serviceruntime）：
# BOOL 不能用 ALIGN_SUM（Monitoring API 直接 400），要用 ALIGN_COUNT_TRUE。
# 与 terraform/default_alerts.tf 的 rec_quota_exceeded 保持一致。
displayName: "Recommended - GCP Quota Exceeded & Allocation Warning"
severity: ERROR
documentation:
  content: |-
    GCP 服务配额触发超限错误（serviceruntime.googleapis.com/quota/exceeded > 0）。
    提示：如需按 80% 静态配额水位提前预警，可在 Cloud Monitoring 控制台将本策略切换为 PromQL：
    `(serviceruntime_googleapis_com:quota_allocation_usage / serviceruntime_googleapis_com:quota_limit) > 0.8`
  mimeType: "text/markdown"
combiner: OR
enabled: true
conditions:
  - displayName: "GCP Consumer Quota Exceeded > 0"
    conditionThreshold:
      filter: 'resource.type = "consumer_quota" AND metric.type = "serviceruntime.googleapis.com/quota/exceeded"'
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 60s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_COUNT_TRUE
          crossSeriesReducer: REDUCE_SUM
          groupByFields:
            - metric.label.quota_metric
            - metric.label.limit_name
alertStrategy:
  autoClose: 86400s
notificationChannels:
  - ${CHANNEL_ID}
